[project]
name = "whatspoppin"
version = "0.1.0"
description = "What'sPoppin: prediction markets, news and social signals mapped to the companies they move"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.13.0",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "newsapi-python==0.2.7",
    "pydantic>=2.9",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn>=0.32",
    "websockets>=17.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
